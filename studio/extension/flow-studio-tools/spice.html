<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Spice</title>
<style>
  :root { --bg:#0d0f15; --panel:#12141c; --line:#2a2f43; --ink:#e6e9f2; --dim:#8a92aa; --hot:#ff5a36; --ok:#3fbf7f; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 2; }
  header h1 { font-size: 17px; margin: 0; } header .sp { flex: 1; }
  main { max-width: 1200px; margin: 0 auto; padding: 16px 20px 60px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  h2 { font-size: 14px; margin: 0 0 10px; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; }
  label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; background: #0a0c11; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; }
  textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; } .row > * { flex: 1; min-width: 160px; }
  button { background: #1c2030; color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.primary { background: var(--hot); border-color: var(--hot); color: #fff; font-weight: 600; }
  button:hover { filter: brightness(1.15); }
  .msg { margin-top: 8px; font-size: 13px; color: var(--dim); white-space: pre-line; } .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .jobs { display: grid; gap: 12px; }
  .job { display: grid; grid-template-columns: 140px 1fr; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #0f1118; }
  .job.flash { outline: 2px solid var(--hot); }
  .job .src img { width: 140px; border-radius: 6px; display: block; }
  .job .meta { font-size: 12px; color: var(--dim); }
  .job .prompt { margin: 6px 0; white-space: pre-wrap; }
  .job .outs { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .job .outs a img { max-height: 340px; max-width: 100%; border-radius: 6px; display: block; }
  .st { font-weight: 600; } .st.SUCCESS { color: var(--ok); } .st.FAILURE { color: var(--err); }
  .acts { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; } .acts button { padding: 4px 9px; font-size: 12px; }
  .empty { color: var(--dim); }
  .out { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
  #again { position: fixed; inset: 0; background: rgba(5,6,9,.7); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #again.show { display: flex; }
  #again .box { width: min(560px, 100%); max-height: 100%; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  #again .hd { display: flex; gap: 12px; align-items: center; } #again .hd img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; }
  #again textarea { min-height: 96px; font-family: inherit; font-size: 13px; }
  #again .presets { display: flex; flex-wrap: wrap; gap: 6px; } #again .presets button { padding: 4px 9px; font-size: 12px; }
  @media (max-width: 640px) { .job { grid-template-columns: 1fr; } .job .src img { width: 100%; } }
</style>
</head>
<body>
<header><h1>🌶 Flow Spice</h1><span class="sp"></span><span class="meta" id="count"></span></header>
<main>
  <section id="setup">
    <h2>Siray account</h2>
    <div class="row">
      <div style="flex:3"><label for="key">API key, from console.siray.ai → Settings. It's stored only in this browser and only sent to api.siray.ai</label><input id="key" type="password" autocomplete="off" spellcheck="false" placeholder="paste your Siray API key"></div>
      <div style="flex:0 0 auto"><button class="primary" id="save">Save &amp; allow</button></div>
    </div>
    <div class="row">
      <div><label for="model">Default model</label><select id="model"></select></div>
      <div><label for="size">Default size</label><select id="size"></select></div>
      <div style="flex:0 0 auto"><button id="price">Check price</button></div>
    </div>
    <div class="msg" id="setupMsg"></div>
  </section>
  <section>
    <h2>Prompt presets</h2>
    <label for="presets">One per line: <code>Name: prompt</code>. They show up as buttons in the 🌶 box in Flow.</label>
    <textarea id="presets"></textarea>
    <div class="acts"><button id="savePresets">Save presets</button></div>
    <div class="msg" id="presetMsg"></div>
  </section>
  <section>
    <h2>Results</h2>
    <div class="jobs" id="jobs"></div>
  </section>
</main>
<div id="again" role="dialog" aria-modal="true"><div class="box">
  <div class="hd"><img id="agImg" alt=""><div><b>🌶 Spice again</b><div class="meta" id="agSub">Edit this result with a new prompt. It goes straight to Siray; Flow isn't involved.</div></div></div>
  <div class="presets" id="agPresets"></div>
  <textarea id="agPrompt" placeholder="What should change this time?"></textarea>
  <div class="row"><select id="agModel"></select><select id="agSize"></select><select id="agN"><option value="1">×1</option><option value="2">×2</option><option value="3">×3</option><option value="4">×4</option></select></div>
  <div class="msg" id="agMsg"></div>
  <div class="acts" style="justify-content:flex-end"><button id="agCancel">Cancel</button><button class="primary" id="agGo">🌶 Spice it</button></div>
</div></div>
<script src="spice-models.js"></script>
<script src="spice-page.js"></script>
</body>
</html>
